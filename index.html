<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JeremyRhys 插件仓库</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px;
         font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #111d32;
         background: #f4f6f9; }
  main { width: min(720px, 100%); }
  .card { padding: 28px; border: 1px solid #e3e8ef; border-radius: 12px; background: #fff; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  p { margin: 8px 0; color: #5b6779; line-height: 1.7; }
  code, .fp { font-family: ui-monospace, Consolas, monospace; }
  .fp { display: block; margin: 12px 0; padding: 12px 14px; border-radius: 8px;
        background: #f2f6fb; color: #14345c; font-size: 13px; word-break: break-all; }
  ol { padding-left: 20px; color: #5b6779; line-height: 1.9; }
  .ok { display: inline-flex; align-items: center; gap: 8px; color: #1c8a63; font-weight: 600; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #20a875; color: #fff;
         display: grid; place-items: center; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>JeremyRhys 插件仓库</h1>
    <p class="ok"><span class="dot">✓</span>签名仓库 · ECDSA P-256</p>
    <p>仓库根目录提供 <code>catalog.json</code> 及其分离签名，插件包在 <code>bundles/</code>。</p>
    <p>公钥指纹（SHA-256）：</p>
    <span class="fp">0d92c24c7b96ff55a068058d8cfd6c80dc494f2698dcbf6dbe2eeae06bdf63e1</span>
    <p>在「插件市场 → 来源 → 添加签名源」里填入本页地址（以 <code>/</code> 结尾），核对指纹一致后确认。</p>
    <ol>
      <li><a href="catalog.json">catalog.json</a> — 插件清单</li>
      <li><a href="repository-public.pem">repository-public.pem</a> — 仓库公钥</li>
      <li><a href="README.md">README.md</a> — 部署与更新说明</li>
    </ol>
  </div>
</main>
</body>
</html>
